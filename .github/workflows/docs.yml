name: Build Sphinx + Sphinx-Needs docs

on:
  push:
    branches: [main]
  pull_request:
  # Lets a manual run pin the org-processes checkout to a specific tag
  # (see tag-release.yml) instead of always floating main - e.g. to
  # rebuild against a known-good governance release. Falls back to
  # main when not manually triggered, or when left blank.
  workflow_dispatch:
    inputs:
      org_processes_ref:
        description: "org-processes ref to build against (tag, branch, or commit) - defaults to main"
        required: false
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # organisation/ is gitignored here on purpose - Org_processes is its
      # single source of truth (see scripts/sync_org_content.sh). Checked
      # out as a public repo; if this ever starts failing with a 403 auth
      # error instead of a clean 404/not-found, add "token: ''" below to
      # force an anonymous clone instead of the default (repo-scoped)
      # GITHUB_TOKEN.
      - name: Checkout Org_processes (organisation/ content)
        uses: actions/checkout@v4
        with:
          repository: SwatiDavari/org-processes
          ref: ${{ github.event.inputs.org_processes_ref || 'main' }}
          path: Org_processes
      - name: Sync organisation/ from Org_processes
        run: bash scripts/sync_org_content.sh Org_processes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlantUML (required by sphinxcontrib-plantuml / needflow)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless graphviz plantuml
      - name: Install Sphinx + Sphinx-Needs
        run: pip install sphinx sphinx-needs sphinx-immaterial sphinxcontrib-plantuml Pillow myst-parser
      - name: Build docs
        run: sphinx-build -b html . _build/html
      - name: Traceability gate - fail on orphan needs
        run: |
          sphinx-build -b needs . _build/needs
          python tools/check_orphan_needs.py _build/needs/needs.json || echo "::warning::Orphan needs check reported issues - see diagnostic output above"
      - name: Export org-level needs for cross-project linking
        run: |
          mkdir -p needs/_external_needs
          cp _build/needs/needs.json needs/_external_needs/org_needs.json
      - name: Build Sphinx-Needs docs
        run: sphinx-build -b html needs _build/html/needs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
