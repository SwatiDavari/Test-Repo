name: Build User Manual PDF

on:
  push:
    branches: [main]
    paths:
      - "doc/manuals/user_manual.rst"
      - "doc/manuals/_static/**"
      - "doc/manuals/_pdf_template/**"
      - ".github/workflows/user_manual_pdf.yml"
  pull_request:
    paths:
      - "doc/manuals/user_manual.rst"
      - "doc/manuals/_static/**"
      - "doc/manuals/_pdf_template/**"
      - ".github/workflows/user_manual_pdf.yml"
  workflow_dispatch: {}

jobs:
  build-user-manual-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc + XeLaTeX (Qorix-branded template needs fontspec/Carlito)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended \
            texlive-latex-extra fonts-crosextra-carlito

      - name: Build Qorix-branded PDF from user_manual.rst
        working-directory: doc/manuals
        run: bash ./_pdf_template/build_pdf.sh user_manual.rst user_manual.pdf \
          "Qorix Product User Manual" "<Config ID>" "0.1.0" "$(date +%d-%b-%Y)" \
          "Draft" "QORIX GmbH" "Germany"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-manual-pdf
          path: doc/manuals/user_manual.pdf
