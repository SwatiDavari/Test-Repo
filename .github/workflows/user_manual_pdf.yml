name: Build User Manual PDF

on:
  push:
    branches: [main]
    paths:
      - "doc/manuals/user_manual.rst"
      - "doc/manuals/_static/**"
      - ".github/workflows/user_manual_pdf.yml"
  pull_request:
    paths:
      - "doc/manuals/user_manual.rst"
      - "doc/manuals/_static/**"
      - ".github/workflows/user_manual_pdf.yml"
  workflow_dispatch: {}

jobs:
  build-user-manual-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc + LaTeX (PDF engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-recommended texlive-latex-extra lmodern

      - name: Build PDF from user_manual.rst
        working-directory: doc/manuals
        run: pandoc user_manual.rst -o user_manual.pdf --pdf-engine=pdflatex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-manual-pdf
          path: doc/manuals/user_manual.pdf
