# Organizational tool register — satisfies ORG_TOOLREG_001.
# One entry per tool actually invoked by a workflow under .github/workflows/
# or .pre-commit-config.yaml. `version_pinned` reflects whether the CI step
# that runs this tool pins an exact version (see ORG_TOOLCFG_001) — most
# entries below do not yet, which is a real, disclosed gap, not an oversight.
# `tcl` and `qualification_status` are TBD for every tool: no formal Tool
# Confidence Level determination (ISO 26262-8 clause 11.4.5-11.4.7) has been
# performed yet — see ORG_TOOLQUAL_001.
tools:
  - id: TOOL_CMAKE
    name: CMake
    version_pinned: false
    toolchain_step: build
    used_in: [source/c, source/cpp]
    ci_workflow: [ci-source-c.yml, ci-source-cpp.yml]
    tcl: TBD
    qualification_status: not_yet_qualified

  - id: TOOL_CTEST
    name: CTest
    version_pinned: false
    toolchain_step: test_execution
    used_in: [source/c, source/cpp]
    ci_workflow: [ci-source-c.yml, ci-source-cpp.yml]
    tcl: TBD
    qualification_status: not_yet_qualified

  - id: TOOL_PYTHON_SOURCE
    name: Python
    version_pinned: true
    version: "3.12"
    toolchain_step: build
    used_in: [source/python]
    ci_workflow: [ci-source-python.yml]
    tcl: TBD
    qualification_status: not_yet_qualified

  - id: TOOL_RUFF
    name: ruff
    version_pinned: false
    toolchain_step: static_analysis
    used_in: [source/python]
    ci_workflow: [ci-source-python.yml]
    tcl: TBD
    qualification_status: not_yet_qualified

  - id: TOOL_PYTEST
    name: pytest
    version_pinned: false
    toolchain_step: test_execution
